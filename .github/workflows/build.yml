name: Banana Splint Native Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build ondevice native packer
        working-directory: ./android
        run: |
          chmod +x ondevice/build.sh
          ./ondevice/build.sh work

      - name: Make gradlew executable
        working-directory: ./android/app
        run: chmod +x gradlew

      - name: Build Banana Splint Native APK
        working-directory: ./android/app
        run: ./gradlew assembleDebug -PnxLabel="Banana Splint Native" -PnxPackStage=../work/stage -PnxPackEngine=native

      - name: Upload Banana Splint Native APK
        uses: actions/upload-artifact@v4
        with:
          name: Banana-Splint-Native
          path: android/app/build/outputs/apk/**/*.apk
